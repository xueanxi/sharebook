extraction:
  error_handling:
    log_errors: true
    retry_count: 3
  llm:
    config_path: sharebook/config/llm_config.py
    max_tokens: 2000
    temperature: 0.4
    timeout: 30
  parallel:
    max_analyzer_agents: 6
    max_csv_agents: 6
  paths:
    config_path: src/services/extraction_character/config.yaml
    # 注意：以下路径在代码中会通过data_helper获取实际路径
    csv_path: data/characters/characters.csv  # 实际使用: data_helper.get_characters_csv_path()
    novel_path: data/raw  # 实际使用: data_helper.get_raw_dir()
  progress:
    current_chapter: 第四十三章 一招入魂！.txt
    last_update_time: '2025-11-28T22:53:37.638401'
